name: Build, lint, and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The release workflow publishes with npm@latest, so the checks run with it where it supports the Node
      # under test. npm 12 requires Node 22.22.2 or 24.15 and up and refuses to install on Node 20, so the
      # Node 20 leg keeps its bundled npm 10; the package suite reads npm pack --json from npm 10 through 12.
      - name: Update npm to the version the release uses
        if: matrix.node-version != '20.x'
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test
