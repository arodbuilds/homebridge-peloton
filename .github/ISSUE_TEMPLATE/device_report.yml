name: Device report
description: Report the codes your Peloton hardware sends, so the device filter can recognise it.
title: "[Device] "
labels: [device]
body:
  - type: dropdown
    id: which-machine
    attributes:
      label: Which machine
      options:
        - Row
        - Bike
        - Bike+
        - Tread
        - Tread+
        - Guide
        - Other
    validations:
      required: true
  - type: input
    id: model-or-year
    attributes:
      label: Model or purchase year
      description: Helps tell hardware generations apart.
  - type: textarea
    id: debug-log-line
    attributes:
      label: Debug log line for the workout
      description: Turn on Debug logging in Advanced, start a workout, and paste the lines the plugin logs when it detects it. They contain the device_type and platform values.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: did-the-trigger-fire
    attributes:
      label: Did the trigger fire
      options:
        - Yes, turned on and off correctly
        - Turned on but not off
        - Never turned on
        - I have not set up a trigger yet
    validations:
      required: true
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
  - type: checkboxes
    id: willing-to-test
    attributes:
      label: Testing
      options:
        - label: I am willing to test fixes
