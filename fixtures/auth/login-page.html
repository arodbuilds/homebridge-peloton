<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in to Peloton</title>
</head>
<body>
  <div id="lock-container"></div>
  <script>
    window.atob = window.atob || function () {};
    var config = JSON.parse(decodeURIComponent(escape(window.atob('cmVkYWN0ZWQ='))));
    var lock = new Auth0Lock(config.clientID, config.auth0Domain, {
      auth: { redirectUrl: config.callbackURL, responseType: 'code', params: config.internalOptions }
    });
    lock.show();
  </script>
</body>
</html>
