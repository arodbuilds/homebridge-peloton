<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in to Peloton</title>
</head>
<body>
  <div id="lock-container"></div>
  <script src="https://cdn.auth0.com/js/lock/12.5/lock.min.js"></script>
  <script>
    // Excerpt of the Lock text dictionary that ships with every Universal Login page, whatever the account's settings.
    var dict = {
      passwordless: { emailInputPlaceholder: "yours@example.com", codeInputPlaceholder: "your code" },
      passwordlessEmailCodeInstructions: "An email with the code has been sent to %s.",
      passwordlessSMSCodeInstructions: "An SMS with the code has been sent to %s.",
      resendCodeAction: "Did not get the code?",
      mfaCodeErrorHint: "Use %d numbers",
      mfaLoginTitle: "2-Step Verification",
      mfaLoginInstructions: "Please enter the verification code generated by your mobile application.",
      unverifiedEmail: "Verify your email to continue.",
      verificationCodeRequired: "Enter the code we sent you",
      enterOtpCode: "Enter the code",
      twoFactorAuth: "Two-factor authentication is a good idea",
      multifactorPolicy: "Multifactor authentication policy",
      mfa_required: "mfa_required"
    };
    var config = JSON.parse(decodeURIComponent(escape(window.atob('cmVkYWN0ZWQ='))));
    var lock = new Auth0Lock(config.clientID, config.auth0Domain, {
      auth: { redirectUrl: config.callbackURL, responseType: 'code', params: config.internalOptions },
      languageDictionary: dict,
      allowedConnections: config.connection ? [config.connection] : null
    });
    lock.show();
  </script>
  <noscript>Verify your identity by enabling JavaScript. Passwordless and one-time code sign-in need it.</noscript>
</body>
</html>
